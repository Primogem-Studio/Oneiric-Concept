// Project-owned build customizations. MCreator regenerates mcreator.gradle.
version = new groovy.json.JsonSlurper().parseText(
        providers.fileContents(layout.projectDirectory.file('oneiricconcept.mcreator')).asText.get()
).workspaceSettings.version
// MCreator's generator exports this exact path, regardless of the workspace version.
// Changing it leaves MCreator exporting a stale JAR (or no JAR on a clean checkout).
tasks.named('jar') {
    archiveFileName = 'modid-1.0.jar'
}

// Keep MCreator's unrestricted Required mods ranges; only enforce the
// minimum NeoForge version required by the bundled dependency.
tasks.named('processResources') {
    inputs.file('gradle/oneiricconcept.gradle')
    filesMatching('META-INF/neoforge.mods.toml') {
        def modId = ''
        filter { String line ->
            def id = line =~ /^\s*modId\s*=\s*"([^"]+)"\s*$/
            if (id.matches()) modId = id.group(1)
            if (line =~ /^\s*versionRange\s*=/) {
                if (modId == 'neoforge') return 'versionRange="[21.1.250,)"'
            }
            return line
        }
    }
}

def primogemcraftNeoJar = file(providers.gradleProperty('primogemcraftNeoJar')
        .getOrElse('libs/primogemcraftneo-1.0.5.jar'))
if (!primogemcraftNeoJar.isFile()) {
    throw new GradleException("PrimogemCraftNeo jar not found: ${primogemcraftNeoJar}. See libs/README.md.")
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.shedaniel.me/' }
}

configurations.configureEach {
    // The original and Neo share a mod ID and must never load together.
    exclude group: 'maven.modrinth', module: '2primogem-craft'
}

dependencies {
    implementation files(primogemcraftNeoJar)
    implementation 'maven.modrinth:genshincraft:3.1.3'
    api 'me.shedaniel:RoughlyEnoughItems-neoforge:16.0.799'
}

// Exercise Minecraft's real language loader against the packaged resources,
// including translations outside MCreator's regenerated mod namespace.
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}
tasks.named('test') {
    // This standalone resource integration check runs through JavaExec below.
    exclude '**/WeaponLocalizationCheck.class'
    exclude '**/ExportCheck.class'
}
def verifyWeaponLocalization = tasks.register('verifyWeaponLocalization', JavaExec) {
    group = 'verification'
    description = 'Verify PGC weapon descriptions using the client language resource loader.'
    dependsOn tasks.named('testClasses'), tasks.named('jar')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.mcreator.oneiricconcept.WeaponLocalizationCheck'
    workingDir = layout.buildDirectory.dir('tmp/verifyWeaponLocalization').get().asFile
    doFirst { workingDir.mkdirs() }
    args tasks.named('jar').get().archiveFile.get().asFile.absolutePath, primogemcraftNeoJar.absolutePath
}
tasks.named('check') {
    dependsOn verifyWeaponLocalization
}

def verifyExport = tasks.register('verifyExport', JavaExec) {
    group = 'verification'
    description = 'Check the exact JAR exported by MCreator for stale code and dependency metadata.'
    dependsOn tasks.named('testClasses'), tasks.named('jar')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.mcreator.oneiricconcept.ExportCheck'
    args layout.buildDirectory.file('libs/modid-1.0.jar').get().asFile.absolutePath,
            tasks.named('jar').get().archiveFile.get().asFile.absolutePath, project.version.toString(),
            layout.projectDirectory.file('.mcreator/setupInfo').asFile.absolutePath
}
tasks.named('check') {
    dependsOn verifyExport
}
